<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DSA Study Calendar</title>
  <!-- Inline SVG favicon: a little calendar with a sage check mark -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='10' width='52' height='48' rx='10' fill='%23faf6ee' stroke='%237a5f4a' stroke-width='4'/%3E%3Cpath d='M6 24h52v-4a10 10 0 0 0-10-10H16A10 10 0 0 0 6 20z' fill='%237a5f4a'/%3E%3Crect x='18' y='3' width='6' height='13' rx='3' fill='%239db39a'/%3E%3Crect x='40' y='3' width='6' height='13' rx='3' fill='%239db39a'/%3E%3Cpath d='M20 41l9 9 16-17' fill='none' stroke='%236f8a6c' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <!-- Speed: start connecting to Firebase and download its code early -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://iist-fd6e8-default-rtdb.firebaseio.com" crossorigin />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ---------- Cozy light theme ---------- */
    :root {
      --cream: #faf6ee;
      --card: #fffdf8;
      --beige: #efe6d5;
      --beige-dark: #e0d3bb;
      --sage: #9db39a;
      --sage-dark: #6f8a6c;
      --brown: #7a5f4a;
      --brown-soft: #a58b75;
      --text: #4a3f35;
      --danger: #b5594d;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--text);
      font-family: "Nunito", "Inter", system-ui, sans-serif;
      line-height: 1.5;
    }

    .app { max-width: 880px; margin: 0 auto; padding: 28px 16px 48px; }

    .app-header { text-align: center; margin-bottom: 16px; }
    .app-header h1 { margin: 0; font-size: 1.8rem; color: var(--brown); }
    .subtitle { margin: 4px 0 0; color: var(--brown-soft); font-size: 0.95rem; }

    /* ---------- Status banner ---------- */
    .status {
      margin: 0 auto 16px;
      padding: 10px 14px;
      border-radius: var(--radius);
      background: var(--beige);
      font-size: 0.9rem;
      text-align: center;
    }
    .status.ok { background: #e3ecde; color: var(--sage-dark); }
    .status.error { background: #f6e0dc; color: var(--danger); }

    /* ---------- Buttons ---------- */
    .btn {
      font: inherit;
      font-weight: 600;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 8px 14px;
      cursor: pointer;
      color: var(--brown);
      background: transparent;
    }
    .btn:focus-visible, input:focus-visible, textarea:focus-visible, .day:focus-visible {
      outline: 2px solid var(--sage-dark);
      outline-offset: 2px;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-ghost { border-color: var(--beige-dark); background: var(--card); }
    .btn-soft { background: var(--beige); }
    .btn-primary { background: var(--sage-dark); color: #fff; }
    .btn-danger { background: #f6e0dc; color: var(--danger); }

    /* ---------- Calendar ---------- */
    .calendar-card {
      background: var(--card);
      border: 1px solid var(--beige-dark);
      border-radius: 20px;
      padding: 18px;
    }

    .controls { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .month-label { flex: 1; margin: 0; text-align: center; font-size: 1.25rem; color: var(--brown); }

    .weekdays, .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .weekdays span {
      text-align: center; font-size: 0.78rem; font-weight: 700;
      color: var(--brown-soft); text-transform: uppercase; padding-bottom: 4px;
    }

    .day {
      min-height: 84px;
      background: #fff;
      border: 1px solid var(--beige);
      border-radius: 12px;
      padding: 6px;
      text-align: left;
      font: inherit;
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }
    .day:hover { background: #fbf7ee; border-color: var(--sage); }
    .day.empty { visibility: hidden; }
    .day.today { border: 2px solid var(--sage-dark); background: #f1f6ee; }
    .day.done { background: #eef4ea; }

    .day-top { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 0.9rem; }
    .check { color: var(--sage-dark); font-style: normal; font-weight: 700; }
    .dots { display: flex; gap: 4px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
    .dot-entry { background: var(--sage-dark); }
    .dot-revisit { background: #d49a5f; }
    .summary { font-size: 0.7rem; color: var(--brown-soft); line-height: 1.25; }

    .legend {
      display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;
      margin: 14px 0 0; font-size: 0.8rem; color: var(--brown-soft);
    }

    /* ---------- Stats ---------- */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
    .stat {
      background: var(--beige); border-radius: var(--radius);
      padding: 12px 8px; text-align: center;
    }
    .stat strong { display: block; font-size: 1.5rem; color: var(--brown); }
    .stat span { font-size: 0.8rem; color: var(--brown-soft); }

    /* ---------- Modal ---------- */
    dialog {
      border: none; border-radius: 20px; padding: 0;
      width: min(480px, calc(100vw - 24px));
      background: var(--card); color: var(--text);
      box-shadow: 0 10px 40px rgba(74, 63, 53, 0.25);
    }
    dialog::backdrop { background: rgba(74, 63, 53, 0.35); }
    form { padding: 22px; }
    form h3 { margin: 0 0 8px; color: var(--brown); }
    label { display: block; font-weight: 600; font-size: 0.85rem; margin: 12px 0 4px; }
    input[type="text"], input[type="number"], input[type="date"], textarea {
      width: 100%; font: inherit; color: var(--text);
      padding: 9px 10px; border: 1px solid var(--beige-dark);
      border-radius: 10px; background: #fff;
    }
    input[readonly] { background: var(--beige); }
    .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .check-row { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .check-row input { width: 18px; height: 18px; accent-color: var(--sage-dark); }
    .form-message { min-height: 1.2em; margin: 10px 0 0; font-size: 0.85rem; color: var(--danger); }
    .form-message.info { color: var(--brown-soft); }
    .actions { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    .spacer { flex: 1; }

    /* ---------- Mobile ---------- */
    @media (max-width: 600px) {
      .calendar-card { padding: 10px; }
      .weekdays, .grid { gap: 3px; }
      .day { min-height: 56px; padding: 4px; border-radius: 9px; }
      .summary { display: none; } /* dots/check are enough; details are in the modal */
      .row { grid-template-columns: 1fr; }
      .controls { flex-wrap: wrap; }
      .month-label { order: -1; flex-basis: 100%; }
      .actions { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>DSA Study Calendar</h1>
      <p class="subtitle">Plan: October – December 2026 · one small step each day</p>
    </header>

    <!-- Connection / loading / error banner -->
    <div id="status" class="status" role="status" aria-live="polite">Loading your entries…</div>

    <!-- Calendar controls -->
    <section class="calendar-card" aria-label="Monthly calendar">
      <div class="controls">
        <button id="prevBtn" class="btn btn-ghost" aria-label="Previous month">&larr;</button>
        <h2 id="monthLabel" class="month-label">October 2026</h2>
        <button id="nextBtn" class="btn btn-ghost" aria-label="Next month">&rarr;</button>
        <button id="todayBtn" class="btn btn-soft">Today</button>
      </div>

      <div class="weekdays" aria-hidden="true">
        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
      </div>
      <div id="grid" class="grid"></div>

      <p class="legend">
        <span><i class="dot dot-entry"></i> Entry saved</span>
        <span><i class="dot dot-revisit"></i> Revisit</span>
        <span><i class="check">✓</i> Studied</span>
      </p>
    </section>

    <!-- Compact statistics (calculated from Firebase data) -->
    <section class="stats" aria-label="Statistics">
      <div class="stat"><strong id="statLectures">0</strong><span>Lectures completed</span></div>
      <div class="stat"><strong id="statSolved">0</strong><span>Problems solved</span></div>
      <div class="stat"><strong id="statDays">0</strong><span>Days with entries</span></div>
    </section>
  </main>

  <!-- Daily entry modal -->
  <dialog id="entryDialog" aria-labelledby="dialogTitle">
    <form id="entryForm" method="dialog" novalidate>
      <h3 id="dialogTitle">Study entry</h3>

      <!-- The date is already shown in the title above, so it's kept as a hidden field -->
      <input type="hidden" id="fDate" />

      <div class="row">
        <div>
          <label for="fLectures">Lectures completed</label>
          <input type="number" id="fLectures" min="0" step="1" value="0" inputmode="numeric" />
        </div>
        <div>
          <label for="fAttempted">Problems attempted</label>
          <input type="number" id="fAttempted" min="0" step="1" value="0" inputmode="numeric" />
        </div>
        <div>
          <label for="fSolved">Problems solved</label>
          <input type="number" id="fSolved" min="0" step="1" value="0" inputmode="numeric" />
        </div>
      </div>

      <label for="fDetails">Lecture numbers / titles covered</label>
      <input type="text" id="fDetails" maxlength="300" placeholder="e.g. Lecture 12 – Binary Search" />

      <label for="fComments">Comments / notes</label>
      <textarea id="fComments" rows="3" maxlength="1000"></textarea>

      <label class="check-row" for="fRevisit">
        <input type="checkbox" id="fRevisit" />
        <span>Revisit this topic</span>
      </label>

      <div id="revisitWrap" hidden>
        <label for="fRevisitNote">Revision note (optional)</label>
        <input type="text" id="fRevisitNote" maxlength="300" />
      </div>

      <p id="formMessage" class="form-message" role="alert"></p>

      <div class="actions">
        <button type="button" id="deleteBtn" class="btn btn-danger" hidden>Delete Entry</button>
        <span class="spacer"></span>
        <button type="button" id="cancelBtn" class="btn btn-ghost">Cancel</button>
        <button type="submit" id="saveBtn" class="btn btn-primary">Save Entry</button>
      </div>
    </form>
  </dialog>

  <script type="module">
    // DSA Study Calendar — vanilla JS + Firebase Realtime Database (modular SDK via CDN)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    /* ---------- Firebase setup ---------- */
    const firebaseConfig = {
      apiKey: "AIzaSyB4eoofAdY4DrW-VKvfGJl5aNv2hoCTn4c",
      authDomain: "iist-fd6e8.firebaseapp.com",
      databaseURL: "https://iist-fd6e8-default-rtdb.firebaseio.com",
      projectId: "iist-fd6e8",
      storageBucket: "iist-fd6e8.firebasestorage.app",
      messagingSenderId: "692699808449",
      appId: "1:692699808449:web:120c8941a940d071f24a40",
      measurementId: "G-GPFG8LWF2H"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    const SAVE_TIMEOUT_MS = 10000; // if Firebase doesn't confirm in 10s, treat as failed

    /* ---------- State ---------- */
    let entries = {};                 // { "2026-10-19": {...}, ... } — mirrors Firebase
    let loaded = false;               // true only after a successful read
    const today = new Date();
    // Start on the current month, but never before the October 2026 planning start.
    let viewYear = today.getFullYear();
    let viewMonth = today.getMonth();
    if (viewYear < 2026 || (viewYear === 2026 && viewMonth < 9)) { viewYear = 2026; viewMonth = 9; }

    /* ---------- Element shortcuts ---------- */
    const $ = (id) => document.getElementById(id);
    const grid = $("grid"), statusBox = $("status"), dialog = $("entryDialog"), form = $("entryForm");
    const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

    /* ---------- Date helpers (local time only, never toISOString) ---------- */
    const pad = (n) => String(n).padStart(2, "0");
    const toKey = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;      // m is 0-based
    const todayKey = () => { const n = new Date(); return toKey(n.getFullYear(), n.getMonth(), n.getDate()); };
    const prettyDate = (key) => {
      const [y, m, d] = key.split("-").map(Number);
      return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    };

    /* ---------- Status banner ---------- */
    function setStatus(text, type = "") {
      statusBox.textContent = text;
      statusBox.className = "status " + type;
    }

    /* ---------- Realtime sync with Firebase ---------- */
    const CACHE_KEY = "dsaStudyEntriesCache";
    let online = false;        // true while connected to the Firebase server
    let triedSignIn = false;   // so we only attempt the silent sign-in once

    // 1) Show the last known data instantly (read-only copy) while Firebase connects.
    function showCached() {
      try {
        const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
        if (cached) {
          entries = cached;
          render();
          setStatus("Showing your last synced copy — connecting live…");
        }
      } catch (e) { /* ignore a broken cache */ }
    }

    // 2) Listen live: every change (from this or any other device) arrives instantly.
    function startLiveSync() {
      onValue(ref(db, "studyEntries"), (snap) => {
        entries = snap.exists() ? snap.val() : {};
        loaded = true;
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(entries)); } catch (e) {}
        setStatus("Live · synced with Firebase", "ok");
        render();
      }, async (err) => {
        loaded = false;
        const denied = String(err.code || err.message).toLowerCase().includes("permission");
        // First denial: sign in silently (anonymous) and listen again.
        // Returning visitors skip this because Firebase remembers the sign-in.
        if (denied && !triedSignIn) {
          triedSignIn = true;
          try { await signInAnonymously(auth); startLiveSync(); return; }
          catch (e) { console.warn("Anonymous auth unavailable:", e.code); }
        }
        console.error(err);
        setStatus(denied
          ? "Firebase denied access (permission_denied). Check your database rules — see the setup steps."
          : "Could not connect to Firebase. Check your connection and config, then refresh.", "error");
        render();
      });

      // Track the connection so the banner and Save button tell the truth.
      onValue(ref(db, ".info/connected"), (snap) => {
        online = snap.val() === true;
        if (loaded) setStatus(online ? "Live · synced with Firebase" : "Offline — reconnecting…", online ? "ok" : "error");
      });
    }

    /* ---------- Rendering ---------- */
    function render() {
      $("monthLabel").textContent = `${MONTHS[viewMonth]} ${viewYear}`;
      grid.innerHTML = "";

      const firstWeekday = new Date(viewYear, viewMonth, 1).getDay();
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

      // Blank cells before the 1st
      for (let i = 0; i < firstWeekday; i++) {
        const blank = document.createElement("div");
        blank.className = "day empty";
        grid.appendChild(blank);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const key = toKey(viewYear, viewMonth, d);
        const entry = entries[key];
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "day";
        btn.setAttribute("aria-label", prettyDate(key) + (entry ? ", entry saved" : ""));

        if (key === todayKey()) btn.classList.add("today");

        const top = document.createElement("div");
        top.className = "day-top";
        const num = document.createElement("span");
        num.textContent = d;
        top.appendChild(num);

        if (entry) {
          // "Studied" = at least one lecture or one solved problem
          if (Number(entry.lectureCount) > 0 || Number(entry.problemsSolved) > 0) {
            btn.classList.add("done");
            const c = document.createElement("i");
            c.className = "check"; c.textContent = "✓";
            top.appendChild(c);
          }
          btn.appendChild(top);

          const dots = document.createElement("div");
          dots.className = "dots";
          dots.innerHTML = '<i class="dot dot-entry"></i>' + (entry.revisit ? '<i class="dot dot-revisit"></i>' : "");
          btn.appendChild(dots);

          const sum = document.createElement("div");
          sum.className = "summary";
          sum.textContent = `${entry.lectureCount || 0} lec · ${entry.problemsSolved || 0}/${entry.problemsAttempted || 0} prob`;
          btn.appendChild(sum);
        } else {
          btn.appendChild(top);
        }

        btn.addEventListener("click", () => openDialog(key));
        grid.appendChild(btn);
      }
      renderStats();
    }

    /* Statistics come straight from the loaded Firebase data */
    function renderStats() {
      const list = Object.values(entries || {});
      $("statLectures").textContent = list.reduce((s, e) => s + (Number(e.lectureCount) || 0), 0);
      $("statSolved").textContent = list.reduce((s, e) => s + (Number(e.problemsSolved) || 0), 0);
      $("statDays").textContent = list.length;
    }

    /* ---------- Month navigation ---------- */
    function shiftMonth(delta) {
      viewMonth += delta;
      if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      render();
    }
    $("prevBtn").addEventListener("click", () => shiftMonth(-1));
    $("nextBtn").addEventListener("click", () => shiftMonth(1));
    $("todayBtn").addEventListener("click", () => {
      const n = new Date(); viewYear = n.getFullYear(); viewMonth = n.getMonth(); render();
    });

    /* ---------- Modal ---------- */
    function setMessage(text, info = false) {
      const m = $("formMessage");
      m.textContent = text;
      m.className = "form-message" + (info ? " info" : "");
    }

    function openDialog(key) {
      const e = entries[key];
      $("dialogTitle").textContent = prettyDate(key);
      $("fDate").value = key;
      $("fLectures").value = e ? e.lectureCount : 0;
      $("fDetails").value = e ? e.lectureDetails || "" : "";
      $("fAttempted").value = e ? e.problemsAttempted : 0;
      $("fSolved").value = e ? e.problemsSolved : 0;
      $("fComments").value = e ? e.comments || "" : "";
      $("fRevisit").checked = e ? !!e.revisit : false;
      $("fRevisitNote").value = e ? e.revisitNote || "" : "";
      $("revisitWrap").hidden = !$("fRevisit").checked;
      $("deleteBtn").hidden = !e;           // delete only when an entry exists
      setMessage("");
      $("saveBtn").disabled = !loaded;      // never allow saving if we couldn't connect
      if (!loaded) setMessage("Not connected to Firebase — saving is disabled. Refresh to retry.");
      dialog.showModal();
    }

    $("fRevisit").addEventListener("change", () => { $("revisitWrap").hidden = !$("fRevisit").checked; });
    $("cancelBtn").addEventListener("click", () => dialog.close());

    // Click on the dim backdrop closes the dialog
    dialog.addEventListener("click", (ev) => { if (ev.target === dialog) dialog.close(); });

    /* Run a Firebase write but fail if it isn't confirmed in time */
    function withTimeout(promise) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), SAVE_TIMEOUT_MS))
      ]);
    }

    function setBusy(busy) {
      $("saveBtn").disabled = busy; $("deleteBtn").disabled = busy; $("cancelBtn").disabled = busy;
    }

    /* Validate: whole numbers, no negatives, solved <= attempted */
    function readNumber(id, label) {
      const raw = $(id).value.trim();
      if (raw === "" || !/^\d+$/.test(raw)) throw new Error(`${label} must be a whole number (0 or more).`);
      return Number(raw);
    }

    /* ---------- Save ---------- */
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      let data;
      try {
        const attempted = readNumber("fAttempted", "Problems attempted");
        const solved = readNumber("fSolved", "Problems solved");
        if (solved > attempted) throw new Error("Problems solved can't be more than problems attempted.");
        const revisit = $("fRevisit").checked;
        data = {
          date: $("fDate").value,
          lectureCount: readNumber("fLectures", "Lectures completed"),
          lectureDetails: $("fDetails").value.trim(),
          problemsAttempted: attempted,
          problemsSolved: solved,
          comments: $("fComments").value.trim(),
          revisit,
          revisitNote: revisit ? $("fRevisitNote").value.trim() : "",
          updatedAt: new Date().toISOString()
        };
      } catch (err) {
        setMessage(err.message);
        return;
      }

      if (!online) { setMessage("You're offline — nothing was saved. Reconnect and try again."); return; }
      setBusy(true);
      setMessage("Saving…", true);
      try {
        await withTimeout(set(ref(db, `studyEntries/${data.date}`), data));
        entries[data.date] = data;            // update local copy only AFTER Firebase confirms
        render();
        setStatus("Entry saved to Firebase.", "ok");
        dialog.close();
      } catch (err) {
        console.error(err);
        setMessage(err.message === "timeout"
          ? "Save not confirmed (timed out). Your entry was NOT saved — try again."
          : "Save failed. Your entry was NOT saved. Check your Firebase rules and connection.");
      } finally {
        setBusy(false);
      }
    });

    /* ---------- Delete ---------- */
    $("deleteBtn").addEventListener("click", async () => {
      const key = $("fDate").value;
      if (!confirm(`Delete the entry for ${prettyDate(key)}? This can't be undone.`)) return;

      if (!online) { setMessage("You're offline — nothing was deleted. Reconnect and try again."); return; }
      setBusy(true);
      setMessage("Deleting…", true);
      try {
        await withTimeout(remove(ref(db, `studyEntries/${key}`)));
        delete entries[key];
        render();
        setStatus("Entry deleted.", "ok");
        dialog.close();
      } catch (err) {
        console.error(err);
        setMessage("Delete failed. The entry was NOT removed. Check your connection and rules.");
      } finally {
        setBusy(false);
      }
    });

    /* ---------- Start ---------- */
    render();           // draw the calendar immediately
    showCached();       // fill it from the local copy, if any
    startLiveSync();    // then connect live
  </script>
</body>
</html>
